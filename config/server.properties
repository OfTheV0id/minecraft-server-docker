# Minecraft服务器配置文件属性
# TODO: add detail annotation.				

accepts-transfers=false
# 是否允许玩家转移（跨服务器传送）

allow-flight=false
# 是否允许玩家飞行（生存模式禁用）

broadcast-console-to-ops=true
# 是否将控制台命令输出广播给OP

broadcast-rcon-to-ops=true
# 是否将RCON命令输出广播给OP

bug-report-link=
# 错误报告链接（留空则使用默认）

chat-spam-threshold-seconds=10
# 聊天消息重复检测时间窗口（秒）

command-spam-threshold-seconds=10
# 命令重复检测时间窗口（秒）

difficulty=easy
# 游戏难度：peaceful/easy/normal/hard

enable-code-of-conduct=false
# 是否启用行为准则提示

enable-jmx-monitoring=false
# 是否启用JMX监控

enable-query=false
# 是否启用GameSpy查询协议

enable-rcon=false
# 是否启用RCON远程控制

enable-status=true
# 是否在服务器列表中显示状态

enforce-secure-profile=true
# 是否强制要求玩家使用安全档案（微软账户签名）

enforce-whitelist=false
# 是否强制启用白名单（未列入则踢出）

entity-broadcast-range-percentage=100
# 实体广播范围百分比（相对于视距）

force-gamemode=false
# 是否强制将玩家游戏模式设为默认

function-permission-level=2
# 函数命令的权限等级（1-4）

gamemode=survival
# 默认游戏模式：survival/creative/adventure/spectator

generate-structures=true
# 是否生成结构（村庄、地牢等）

generator-settings={}
# 世界生成器的额外设置（JSON格式）

hardcore=false
# 是否开启极限模式（死亡后永久旁观）

hide-online-players=false
# 是否隐藏在线玩家列表（对非OP）

initial-disabled-packs=
# 初始禁用的数据包列表

initial-enabled-packs=vanilla
# 初始启用的数据包列表（vanilla为原版）

level-name=world
# 世界文件夹名称

level-seed=
# 世界种子（留空则随机）

level-type=minecraft\:normal
# 世界类型：normal/flat/large_biomes/amplified等

log-ips=true
# 是否记录玩家IP地址

management-server-allowed-origins=
# 管理服务器允许的跨域来源

management-server-enabled=false
# 是否启用管理服务器（用于远程管理）

management-server-host=localhost
# 管理服务器绑定的主机地址

management-server-port=0
# 管理服务器端口（0表示随机）

management-server-secret=
# 管理服务器的共享密钥(TODO: figure how whether it can be empty)

management-server-tls-enabled=true
# 管理服务器是否启用TLS加密

management-server-tls-keystore=
# TLS密钥库文件路径

management-server-tls-keystore-password=
# TLS密钥库密码

max-chained-neighbor-updates=1000000
# 最大连锁邻居更新次数（防卡服）

max-players=20
# 最大玩家数

max-tick-time=60000
# 单Tick最大耗时（毫秒），超时则强制关闭

max-world-size=29999984
# 世界边界半径（从中心到边界）

motd=A Minecraft Server
# 服务器欢迎语（显示在外部列表）

network-compression-threshold=256
# 网络数据包压缩阈值（字节）

online-mode=true
# 是否开启正版验证（需微软账户）

op-permission-level=4
# OP权限等级（1-4，4为最高）

pause-when-empty-seconds=60
# 空服后暂停游戏Tick的等待时间（秒）

player-idle-timeout=0
# 玩家空闲超时踢出时间（秒，0为禁用）

prevent-proxy-connections=false
# 是否阻止代理连接（防VPN）

query.port=25565
# 查询协议监听的端口

rate-limit=0
# IP连接速率限制（0为无限）

rcon.password=
# RCON密码（启用rcon时必填）

rcon.port=25575
# RCON端口

region-file-compression=deflate
# 区域文件压缩算法（deflate或none）

require-resource-pack=false
# 是否强制玩家接受资源包

resource-pack=
# 资源包下载URL

resource-pack-id=
# 资源包唯一标识

resource-pack-prompt=
# 资源包提示信息（显示给玩家）

resource-pack-sha1=
# 资源包的SHA-1哈希值（用于校验）

server-ip=
# 服务器绑定的IP地址（留空则绑定所有）

server-port=25565
# 服务器端口

simulation-distance=10
# 模拟距离（区块数），影响实体和红石更新

spawn-protection=16
# 出生点保护半径（方块数）

status-heartbeat-interval=0
# 状态心跳间隔（秒，0表示禁用）

sync-chunk-writes=true
# 是否同步写入区块数据（保证数据安全）

text-filtering-config=
# 文本过滤配置文件路径

text-filtering-version=0
# 文本过滤版本号

use-native-transport=true
# 是否使用原生网络传输（优化性能）

view-distance=10
# 视距（区块数）

white-list=false
# 是否启用白名单